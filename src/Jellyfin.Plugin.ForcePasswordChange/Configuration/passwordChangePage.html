<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Change your Jellyfin password</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #101010;
      color: #f2f2f2;
    }

    main {
      box-sizing: border-box;
      width: min(100% - 2rem, 28rem);
      padding: 2rem;
      border-radius: 0.75rem;
      background: #202020;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.75rem;
      border: 1px solid #777;
      border-radius: 0.3rem;
      font: inherit;
    }

    button {
      margin-top: 1.5rem;
      border: 0;
      background: #00a4dc;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #message {
      min-height: 1.5em;
      margin-top: 1rem;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Change your Jellyfin password</h1>
    <p id="intro">Sign in with your Jellyfin username and current password to continue.</p>
    <form id="passwordForm" autocomplete="on">
      <section id="signInFields">
        <label id="usernameLabel" for="username">Jellyfin username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label id="currentPasswordLabel" for="currentPassword">Current password</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required />
      </section>
      <section id="changeFields" class="hidden">
        <label id="newPasswordLabel" for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required disabled />
        <label id="confirmPasswordLabel" for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required disabled />
      </section>
      <button id="submitButton" type="submit">Sign in</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const isGerman = navigator.language.toLowerCase().startsWith('de');
      const text = isGerman
        ? {
            title: 'Jellyfin-Passwort ändern',
            signInIntro: 'Melde dich mit deinem Jellyfin-Benutzernamen und deinem aktuellen Passwort an.',
            username: 'Jellyfin-Benutzername',
            currentPassword: 'Aktuelles Passwort',
            newPassword: 'Neues Passwort',
            confirmPassword: 'Neues Passwort bestätigen',
            signIn: 'Anmelden',
            changePassword: 'Passwort ändern',
            invalidUrl: 'Diese Seitenadresse ist ungültig. Öffne den Link, den du von deinem Jellyfin-Administrator erhalten hast.',
            missingToken: 'Jellyfin hat kein Anmeldetoken zurückgegeben.',
            noChangeRequired: 'Für dieses Konto ist derzeit kein Passwortwechsel erforderlich.',
            choosePassword: length => `Wähle ein neues Passwort mit mindestens ${length} Zeichen.`,
            signInSuccess: 'Anmeldung erfolgreich. Wähle ein neues Passwort, um den angeforderten Wechsel abzuschließen.',
            tooShort: length => `Das neue Passwort muss mindestens ${length} Zeichen lang sein.`,
            mismatch: 'Die neuen Passwörter stimmen nicht überein.',
            complete: 'Dein Jellyfin-Passwort wurde erfolgreich geändert.',
            completeMessage: 'Der Passwortwechsel ist abgeschlossen. Du kannst dich jetzt mit deinem neuen Passwort bei Jellyfin anmelden.',
            failed: 'Die Anfrage ist fehlgeschlagen. Bitte versuche es erneut.'
          }
        : {
            title: 'Change your Jellyfin password',
            signInIntro: 'Sign in with your Jellyfin username and current password to continue.',
            username: 'Jellyfin username',
            currentPassword: 'Current password',
            newPassword: 'New password',
            confirmPassword: 'Confirm new password',
            signIn: 'Sign in',
            changePassword: 'Change password',
            invalidUrl: 'This page URL is not recognized. Open it using the link provided by your Jellyfin administrator.',
            missingToken: 'Jellyfin did not return an access token.',
            noChangeRequired: 'No password change is currently required for this account.',
            choosePassword: length => `Choose a new password with at least ${length} characters.`,
            signInSuccess: 'Sign-in successful. Choose a new password to complete the required change.',
            tooShort: length => `The new password must be at least ${length} characters long.`,
            mismatch: 'The new passwords do not match.',
            complete: 'Your Jellyfin password has been changed successfully.',
            completeMessage: 'The password change requirement is complete. You can now sign in to Jellyfin with your new password.',
            failed: 'The request failed. Please try again.'
          };
      document.documentElement.lang = isGerman ? 'de' : 'en';
      document.querySelector('#title').textContent = text.title;
      document.querySelector('#intro').textContent = text.signInIntro;
      document.querySelector('#usernameLabel').textContent = text.username;
      document.querySelector('#currentPasswordLabel').textContent = text.currentPassword;
      document.querySelector('#newPasswordLabel').textContent = text.newPassword;
      document.querySelector('#confirmPasswordLabel').textContent = text.confirmPassword;
      document.querySelector('#submitButton').textContent = text.signIn;

      const routeSuffix = '/Plugin/ForcePasswordChange/PasswordChangePage';
      const pagePath = window.location.pathname.replace(/\/+$/, '');
      if (!pagePath.endsWith(routeSuffix)) {
        document.querySelector('#message').textContent = text.invalidUrl;
        document.querySelector('#passwordForm').classList.add('hidden');
        return;
      }

      const serverBase = pagePath.slice(0, -routeSuffix.length);
      const pluginBase = `${serverBase}/Plugin/ForcePasswordChange`;
      const deviceId = crypto.randomUUID();
      const form = document.querySelector('#passwordForm');
      const signInFields = document.querySelector('#signInFields');
      const changeFields = document.querySelector('#changeFields');
      const intro = document.querySelector('#intro');
      const message = document.querySelector('#message');
      const submitButton = document.querySelector('#submitButton');
      let accessToken;
      let minimumPasswordLength = 12;
      let signedIn = false;

      function getAuthorizationHeader() {
        const values = [
          'Client="Force Password Change"',
          'Device="Web Browser"',
          `DeviceId="${deviceId}"`,
          'Version="1.0.0"'
        ];
        if (accessToken) {
          values.push(`Token="${accessToken}"`);
        }
        return `MediaBrowser ${values.join(', ')}`;
      }

      function setMessage(messageText, isError = false) {
        message.textContent = isError
          ? `${isGerman ? 'Fehler: ' : 'Error: '}${messageText}`
          : messageText;
        message.setAttribute('aria-label', message.textContent);
      }

      async function request(url, options = {}) {
        const headers = new Headers(options.headers);
        headers.set('Authorization', getAuthorizationHeader());
        if (options.body) {
          headers.set('Content-Type', 'application/json');
        }

        const response = await fetch(url, {
          ...options,
          headers,
          cache: 'no-store',
          credentials: 'omit',
          referrerPolicy: 'no-referrer'
        });

        if (!response.ok) {
          const body = await response.json().catch(() => null);
          throw new Error(body?.Message || body?.message || `Jellyfin returned HTTP ${response.status}.`);
        }

        return response.status === 204 ? null : response.json();
      }

      async function signIn() {
        const result = await request(`${serverBase}/Users/AuthenticateByName`, {
          method: 'POST',
          body: JSON.stringify({
            Username: document.querySelector('#username').value,
            Pw: document.querySelector('#currentPassword').value
          })
        });

        if (!result?.AccessToken) {
          throw new Error(text.missingToken);
        }

        accessToken = result.AccessToken;
        const status = await request(`${pluginBase}/Status`);
        if (!status.passwordChangeRequired) {
          accessToken = undefined;
          throw new Error(text.noChangeRequired);
        }

        minimumPasswordLength = status.minimumPasswordLength;
        signedIn = true;
        signInFields.classList.add('hidden');
        changeFields.classList.remove('hidden');
        document.querySelector('#newPassword').disabled = false;
        document.querySelector('#confirmPassword').disabled = false;
        document.querySelector('#username').required = false;
        document.querySelector('#currentPassword').required = false;
        document.querySelector('#newPassword').minLength = minimumPasswordLength;
        document.querySelector('#confirmPassword').minLength = minimumPasswordLength;
        intro.textContent = text.choosePassword(minimumPasswordLength);
        submitButton.textContent = text.changePassword;
        setMessage(text.signInSuccess);
        document.querySelector('#newPassword').focus();
      }

      async function changePassword() {
        const newPassword = document.querySelector('#newPassword').value;
        const confirmPassword = document.querySelector('#confirmPassword').value;

        if (newPassword.length < minimumPasswordLength) {
          throw new Error(text.tooShort(minimumPasswordLength));
        }
        if (newPassword !== confirmPassword) {
          throw new Error(text.mismatch);
        }

        await request(`${pluginBase}/ChangePassword`, {
          method: 'POST',
          body: JSON.stringify({ NewPassword: newPassword })
        });

        accessToken = undefined;
        form.reset();
        form.classList.add('hidden');
        intro.textContent = text.complete;
        setMessage(text.completeMessage);
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        submitButton.disabled = true;
        setMessage('');
        try {
          if (signedIn) {
            await changePassword();
          } else {
            await signIn();
          }
        } catch (error) {
          accessToken = undefined;
          signedIn = false;
          document.querySelector('#currentPassword').value = '';
          document.querySelector('#newPassword').value = '';
          document.querySelector('#confirmPassword').value = '';
          signInFields.classList.remove('hidden');
          changeFields.classList.add('hidden');
          document.querySelector('#newPassword').disabled = true;
          document.querySelector('#confirmPassword').disabled = true;
          document.querySelector('#username').required = true;
          document.querySelector('#currentPassword').required = true;
          submitButton.textContent = text.signIn;
          setMessage(error.message || text.failed, true);
        } finally {
          submitButton.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
