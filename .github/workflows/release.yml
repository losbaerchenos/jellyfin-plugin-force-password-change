name: Publish plugin release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.ForcePasswordChange.Tests/Jellyfin.Plugin.ForcePasswordChange.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish src/Jellyfin.Plugin.ForcePasswordChange/Jellyfin.Plugin.ForcePasswordChange.csproj --configuration Release --no-restore --output output

      - name: Package release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_URL="$(jq -r --arg version "$VERSION" '[.[0].versions[] | select(.version == $version) | .sourceUrl][0] // empty' manifest.json)"
          EXPECTED_URL="https://github.com/losbaerchenos/jellyfin-plugin-force-password-change/releases/download/${GITHUB_REF_NAME}/Jellyfin.Plugin.ForcePasswordChange_${VERSION}.zip"
          if [[ "$MANIFEST_URL" != "$EXPECTED_URL" ]]; then
            echo "Manifest entry for $VERSION must point to $EXPECTED_URL" >&2
            exit 1
          fi
          PACKAGE_NAME="Jellyfin.Plugin.ForcePasswordChange_${VERSION}.zip"
          cd output
          zip -r "../${PACKAGE_NAME}" .
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_NAME" --clobber
