name: Publish plugin release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: jellyfin-plugin-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main ||
             ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already contained in main." >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.ForcePasswordChange.Tests/Jellyfin.Plugin.ForcePasswordChange.Tests.csproj --configuration Release

  reserve:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.reserve_tag.outputs.release_tag }}
      version: ${{ steps.reserve_tag.outputs.version }}
      recover_incomplete: ${{ steps.reserve_tag.outputs.recover_incomplete }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate release version
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          max_component = 65534
          pattern = re.compile(r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")

          def parse_tag(tag):
              match = pattern.fullmatch(tag)
              if match is None:
                  return None
              version = tuple(map(int, match.groups()))
              return version if all(0 <= part <= max_component for part in version) else None

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()
          tag_versions = {tag: parse_tag(tag) for tag in tags}
          tag_versions = {tag: version for tag, version in tag_versions.items() if version is not None}
          tag_commits = {
              tag: subprocess.check_output(
                  ["git", "rev-list", "-n", "1", tag], text=True
              ).strip()
              for tag in tag_versions
          }
          release_pages = json.loads(subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp",
               f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"],
              text=True,
          ))
          releases = [release for page in release_pages for release in page]
          published_tags = {
              release["tag_name"]
              for release in releases
              if not release["draft"] and parse_tag(release["tag_name"]) is not None
          }
          published_versions = {
              tag: tag_versions[tag]
              for tag in published_tags
              if tag in tag_versions
          }
          latest_published_version = max(published_versions.values(), default=None)

          if os.environ["GITHUB_REF_TYPE"] == "tag":
              release_tag = os.environ["GITHUB_REF_NAME"]
              recover_incomplete = False
              version = parse_tag(release_tag)
              if version is None:
                  raise SystemExit(
                      "Tag must use canonical vMAJOR.MINOR.PATCH.REVISION components "
                      "(no leading zeroes), each between 0 and 65534."
                  )
              newer_tags = [
                  tag_version
                  for tag, tag_version in tag_versions.items()
                  if tag != release_tag
              ]
              if newer_tags and version <= max(newer_tags):
                  raise SystemExit(
                      "A manual release tag must be newer than every existing canonical version tag."
                  )
          else:
              current_sha = os.environ["GITHUB_SHA"]
              if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
                  main_tip = subprocess.check_output(
                      ["gh", "api",
                       f"repos/{os.environ['GITHUB_REPOSITORY']}/branches/main",
                       "--jq", ".commit.sha"],
                      text=True,
                  ).strip()
                  if current_sha != main_tip:
                      raise SystemExit(
                          "Manual release dispatch must target the current main branch tip."
                      )

              matching_tags = [
                  (version, tag)
                  for tag, version in tag_versions.items()
                  if tag_commits[tag] == current_sha
              ]
              if matching_tags:
                  version, release_tag = max(matching_tags)
                  matching_release = next(
                      (release for release in releases
                       if release["tag_name"] == release_tag),
                      None,
                  )
                  expected_package = (
                      "Jellyfin.Plugin.ForcePasswordChange_"
                      + ".".join(map(str, version))
                      + ".zip"
                  )
                  has_complete_release = (
                      matching_release is not None
                      and not matching_release["draft"]
                      and expected_package in {
                          asset["name"] for asset in matching_release["assets"]
                      }
                      and "manifest.json" in {
                          asset["name"] for asset in matching_release["assets"]
                      }
                  )
                  recover_incomplete = (
                      os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
                      and not has_complete_release
                  )
              else:
                  if tag_versions:
                      latest_tag = max(tag_versions, key=tag_versions.get)
                      latest_tag_commit = tag_commits[latest_tag]
                      if subprocess.run(
                          ["git", "merge-base", "--is-ancestor",
                           latest_tag_commit, current_sha],
                          check=False,
                      ).returncode != 0:
                          raise SystemExit(
                              "This main-branch run is older than or diverges from the "
                              "latest version tag; refusing to publish stale source."
                          )

                  if published_versions:
                      latest_published_tag = max(
                          published_versions, key=published_versions.get
                      )
                      latest_published_commit = tag_commits[latest_published_tag]
                      is_ancestor = subprocess.run(
                          ["git", "merge-base", "--is-ancestor",
                           latest_published_commit, current_sha],
                          check=False,
                      ).returncode == 0
                      if not is_ancestor:
                          raise SystemExit(
                              "This main-branch run is older than or diverges from the "
                              "latest published release; refusing to publish stale source."
                          )

                  pending_versions = []
                  release_by_tag = {release["tag_name"]: release for release in releases}
                  for tag, candidate_version in tag_versions.items():
                      if (tag in published_tags or
                              (latest_published_version is not None and
                               candidate_version <= latest_published_version)):
                          continue
                      candidate_commit = tag_commits[tag]
                      if subprocess.run(
                          ["git", "merge-base", "--is-ancestor",
                           candidate_commit, current_sha],
                          check=False,
                      ).returncode != 0:
                          continue
                      release = release_by_tag.get(tag)
                      if release is None or release["draft"]:
                          pending_versions.append((candidate_version, tag))

                  if pending_versions:
                      version, release_tag = min(pending_versions)
                      recover_incomplete = True
                  elif not tag_versions:
                      version = (1, 0, 0, 0)
                      release_tag = "v1.0.0.0"
                      recover_incomplete = False
                  else:
                      latest_version = max(tag_versions.values())
                      parts = list(latest_version)
                      for index in range(3, -1, -1):
                          if parts[index] < max_component:
                              parts[index] += 1
                              for following in range(index + 1, 4):
                                  parts[following] = 0
                              break
                      else:
                          raise SystemExit(
                              "No valid .NET AssemblyVersion remains for an automatic release."
                          )
                      version = tuple(parts)
                      release_tag = "v" + ".".join(map(str, version))
                      recover_incomplete = False

          version_text = ".".join(map(str, version))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(
                  f"version={version_text}\nrelease_tag={release_tag}\n"
                  f"recover_incomplete={str(recover_incomplete).lower()}\n"
              )
          print(f"Release version candidate: {version_text} ({release_tag})")
          PY

      - name: Reserve release tag
        id: reserve_tag
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_RELEASE_TAG: ${{ steps.release_version.outputs.release_tag }}
          INITIAL_VERSION: ${{ steps.release_version.outputs.version }}
          INITIAL_RECOVER_INCOMPLETE: ${{ steps.release_version.outputs.recover_incomplete }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${INITIAL_RELEASE_TAG}"
          VERSION="${INITIAL_VERSION}"
          RECOVER_INCOMPLETE="${INITIAL_RECOVER_INCOMPLETE}"
          LOOKUP_ERROR="$(mktemp)"

          get_tag_commit() {
            local object_json object_type object_sha
            if ! object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>"${LOOKUP_ERROR}")"; then
              if grep -Fq '(HTTP 404)' "${LOOKUP_ERROR}"; then
                printf ''
                return 0
              fi
              cat "${LOOKUP_ERROR}" >&2
              return 1
            fi
            object_type="$(jq -r '.object.type' <<< "${object_json}")"
            object_sha="$(jq -r '.object.sha' <<< "${object_json}")"
            while [[ "${object_type}" == "tag" ]]; do
              object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "${object_json}")"
              object_sha="$(jq -r '.object.sha' <<< "${object_json}")"
            done
            [[ "${object_type}" == "commit" ]] || {
              echo "Release tag ${RELEASE_TAG} resolves to unsupported object ${object_type}." >&2
              return 1
            }
            printf '%s' "${object_sha}"
          }

          ensure_current_main_tip() {
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              local main_tip
              main_tip="$(gh api \
                "repos/${GITHUB_REPOSITORY}/branches/main" \
                --jq '.commit.sha')"
              if [[ "${main_tip}" != "${GITHUB_SHA}" ]]; then
                echo "Refusing to reserve a release for stale commit ${GITHUB_SHA}; current main is ${main_tip}." >&2
                return 1
              fi
            fi
          }

          bump_version() {
            VERSION="$(python3 -c '
          parts = list(map(int, __import__("sys").argv[1].split(".")))
          for index in range(3, -1, -1):
              if parts[index] < 65534:
                  parts[index] += 1
                  for following in range(index + 1, 4):
                      parts[following] = 0
                  break
          else:
              raise SystemExit("No valid .NET AssemblyVersion remains.")
          print(".".join(map(str, parts)))
          ' "${VERSION}")"
            RELEASE_TAG="v${VERSION}"
            RECOVER_INCOMPLETE=false
          }

          for attempt in {1..20}; do
            ensure_current_main_tip
            TAG_COMMIT="$(get_tag_commit)"
            if [[ -n "${TAG_COMMIT}" ]]; then
              if [[ "${TAG_COMMIT}" == "${GITHUB_SHA}" ]]; then
                break
              fi
              if [[ "${GITHUB_REF_TYPE}" != "tag" && "${RECOVER_INCOMPLETE}" == "true" ]]; then
                COMPARISON_STATUS="$(gh api \
                  "repos/${GITHUB_REPOSITORY}/compare/${TAG_COMMIT}...${GITHUB_SHA}" \
                  --jq '.status')"
                if RELEASE_JSON="$(gh api \
                  "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
                  2>"${LOOKUP_ERROR}")"; then
                  :
                elif grep -Fq '(HTTP 404)' "${LOOKUP_ERROR}"; then
                  RELEASE_JSON=""
                else
                  cat "${LOOKUP_ERROR}" >&2
                  exit 1
                fi
                if [[ "${COMPARISON_STATUS}" == "ahead" || "${COMPARISON_STATUS}" == "identical" ]]; then
                  if [[ -n "${RELEASE_JSON}" ]]; then
                    [[ "$(jq -r '.draft' <<< "${RELEASE_JSON}")" == "true" ]] || {
                      echo "Cannot retarget published release ${RELEASE_TAG}." >&2
                      exit 1
                    }
                    gh api --method DELETE \
                      "repos/${GITHUB_REPOSITORY}/releases/$(jq -r '.id' <<< "${RELEASE_JSON}")"
                  fi
                  gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
                  TAG_COMMIT=""
                else
                  bump_version
                  continue
                fi
              else
                bump_version
                continue
              fi
            fi

            if [[ -z "${TAG_COMMIT}" ]]; then
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${RELEASE_TAG}" \
                -f "sha=${GITHUB_SHA}" 2>"${LOOKUP_ERROR}"; then
                TAG_COMMIT="$(get_tag_commit)"
                [[ "${TAG_COMMIT}" == "${GITHUB_SHA}" ]] || {
                  echo "Reserved tag ${RELEASE_TAG} does not point to this build commit." >&2
                  exit 1
                }
                ensure_current_main_tip
                break
              fi

              TAG_COMMIT="$(get_tag_commit)"
              if [[ -z "${TAG_COMMIT}" ]]; then
                cat "${LOOKUP_ERROR}" >&2
                exit 1
              fi
              if [[ "${TAG_COMMIT}" == "${GITHUB_SHA}" ]]; then
                ensure_current_main_tip
                break
              fi
              bump_version
            fi
          done

          ensure_current_main_tip
          if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "Could not reserve a unique release tag after 20 attempts." >&2
            exit 1
          fi
          rm -f "${LOOKUP_ERROR}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "recover_incomplete=${RECOVER_INCOMPLETE}" >> "${GITHUB_OUTPUT}"

  package:
    needs: reserve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/Jellyfin.Plugin.ForcePasswordChange/Jellyfin.Plugin.ForcePasswordChange.csproj
          --configuration Release
          --output output
          -p:Version="${{ needs.reserve.outputs.version }}"
          -p:AssemblyVersion="${{ needs.reserve.outputs.version }}"
          -p:FileVersion="${{ needs.reserve.outputs.version }}"

      - name: Package plugin and repository manifest
        env:
          VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          PACKAGE_NAME="Jellyfin.Plugin.ForcePasswordChange_${VERSION}.zip"
          (cd output && zip -r "../${PACKAGE_NAME}" .)

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-release-assets
          path: Jellyfin.Plugin.ForcePasswordChange_*.zip
          if-no-files-found: error

  release:
    needs:
      - reserve
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: plugin-release-assets
          path: .

      - name: Create GitHub release with plugin package and repository manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.reserve.outputs.release_tag }}
          VERSION: ${{ needs.reserve.outputs.version }}
          RECOVER_INCOMPLETE: ${{ needs.reserve.outputs.recover_incomplete }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="Jellyfin.Plugin.ForcePasswordChange_${VERSION}.zip"
          LOOKUP_ERROR="$(mktemp)"

          find_release() {
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -c --arg tag "${RELEASE_TAG}" \
                '[.[][] | select(.tag_name == $tag)] | sort_by(.draft) | .[0] // empty'
          }

          ensure_current_main_tip() {
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              local main_tip
              main_tip="$(gh api \
                "repos/${GITHUB_REPOSITORY}/branches/main" \
                --jq '.commit.sha')"
              if [[ "${main_tip}" != "${GITHUB_SHA}" ]]; then
                echo "Refusing to publish stale commit ${GITHUB_SHA}; current main is ${main_tip}." >&2
                return 1
              fi
            fi
          }
          ensure_current_main_tip

          RELEASE_JSON="$(find_release)"
          if [[ -z "${RELEASE_JSON}" ]]; then
            if ! RELEASE_JSON="$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              -f "tag_name=${RELEASE_TAG}" \
              -f "target_commitish=${GITHUB_SHA}" \
              -f "name=Force Password Change ${VERSION}" \
              -F draft=true \
              -F generate_release_notes=true \
              2>"${LOOKUP_ERROR}")"; then
              RELEASE_JSON="$(find_release)"
              if [[ -z "${RELEASE_JSON}" ]]; then
                cat "${LOOKUP_ERROR}" >&2
                exit 1
              fi
            fi
          fi

          [[ "$(jq -r '.tag_name' <<< "${RELEASE_JSON}")" == "${RELEASE_TAG}" ]] || {
            echo "GitHub returned a release for an unexpected tag." >&2
            exit 1
          }
          RELEASE_ID="$(jq -r '.id' <<< "${RELEASE_JSON}")"
          IS_DRAFT="$(jq -r '.draft' <<< "${RELEASE_JSON}")"
          TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object | [.type, .sha] | @tsv')"
          IFS=$'\t' read -r TAG_OBJECT_TYPE TAG_COMMIT <<< "${TAG_OBJECT}"
          while [[ "${TAG_OBJECT_TYPE}" == "tag" ]]; do
            TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_COMMIT}" --jq '.object | [.type, .sha] | @tsv')"
            IFS=$'\t' read -r TAG_OBJECT_TYPE TAG_COMMIT <<< "${TAG_OBJECT}"
          done
          if [[ "${TAG_OBJECT_TYPE}" != "commit" || "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not resolve to this build's ${GITHUB_SHA}." >&2
            exit 1
          fi
          rm -f "${LOOKUP_ERROR}"

          mkdir -p previous-release published-package retained-packages
          PACKAGE_UPLOAD_REQUIRED=false
          if [[ "${IS_DRAFT}" == "true" ]]; then
            PACKAGE_PATH="${PACKAGE_NAME}"
          else
            if jq -e --arg package "${PACKAGE_NAME}" \
              'any(.assets[]; .name == $package)' \
              <<< "${RELEASE_JSON}" > /dev/null; then
              gh release download "${RELEASE_TAG}" \
                --pattern "${PACKAGE_NAME}" \
                --dir published-package
              PACKAGE_PATH="published-package/${PACKAGE_NAME}"
            elif [[ "${RECOVER_INCOMPLETE}" == "true" && "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              PACKAGE_PATH="${PACKAGE_NAME}"
              PACKAGE_UPLOAD_REQUIRED=true
            else
              echo "Published release is missing ${PACKAGE_NAME}; only a manual recovery run may repair it." >&2
              exit 1
            fi
          fi

          LATEST_MANIFEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'sort_by(.published_at // .created_at) | reverse | [.[] | select(.draft == false and any(.assets[]; .name == "manifest.json")) | .tag_name] | first // empty')"
          MANIFEST_SOURCE="manifest.json"
          if [[ -n "${LATEST_MANIFEST_TAG}" ]]; then
            gh release download "${LATEST_MANIFEST_TAG}" --pattern manifest.json --dir previous-release
            MANIFEST_SOURCE="previous-release/manifest.json"
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${PACKAGE_NAME}"
          PACKAGE_CHECKSUM="$(md5sum "${PACKAGE_PATH}" | awk '{print toupper($1)}')"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq \
            --arg version "${VERSION}" \
            --arg sourceUrl "${RELEASE_URL}" \
            --arg checksum "${PACKAGE_CHECKSUM}" \
            --arg timestamp "${TIMESTAMP}" \
            '.[0] as $plugin
            | ($plugin.versions[0]) as $versionTemplate
            | [
                $plugin
                | .versions = (
                    ([.versions[] | select(.version != $version)])
                    + [
                        ($versionTemplate
                          | .version = $version
                          | .changelog = ("Release " + $version + ". See the GitHub release notes.")
                          | .sourceUrl = $sourceUrl
                          | .checksum = $checksum
                          | .timestamp = $timestamp)
                      ]
                  )
              ]' \
            "${MANIFEST_SOURCE}" > manifest.json

          while IFS=$'\t' read -r RETAINED_VERSION RETAINED_SOURCE_URL; do
            [[ -n "${RETAINED_VERSION}" ]] || continue

            RELEASE_ASSET_PATH="${RETAINED_SOURCE_URL#*/releases/download/}"
            if [[ "${RELEASE_ASSET_PATH}" == "${RETAINED_SOURCE_URL}" || "${RELEASE_ASSET_PATH}" != */* ]]; then
              echo "Cannot derive a GitHub release asset from ${RETAINED_SOURCE_URL} for version ${RETAINED_VERSION}." >&2
              exit 1
            fi
            RETAINED_TAG="${RELEASE_ASSET_PATH%%/*}"
            RETAINED_PACKAGE="${RELEASE_ASSET_PATH#*/}"
            if [[ "${RETAINED_PACKAGE}" == */* || -z "${RETAINED_TAG}" || -z "${RETAINED_PACKAGE}" ]]; then
              echo "Invalid plugin package URL for retained version ${RETAINED_VERSION}: ${RETAINED_SOURCE_URL}" >&2
              exit 1
            fi

            RETAINED_DIR="retained-packages/${RETAINED_VERSION}"
            mkdir -p "${RETAINED_DIR}"
            gh release download "${RETAINED_TAG}" \
              --pattern "${RETAINED_PACKAGE}" \
              --dir "${RETAINED_DIR}"
            RETAINED_CHECKSUM="$(md5sum "${RETAINED_DIR}/${RETAINED_PACKAGE}" | awk '{print toupper($1)}')"
            jq \
              --arg version "${RETAINED_VERSION}" \
              --arg checksum "${RETAINED_CHECKSUM}" \
              '.[0].versions |= map(if .version == $version then .checksum = $checksum else . end)' \
              manifest.json > manifest.tmp
            mv manifest.tmp manifest.json
          done < <(jq -r '.[0].versions[] | select((.checksum // "") == "") | [.version, .sourceUrl] | @tsv' manifest.json)

          jq -e --arg version "${VERSION}" \
            --arg checksum "${PACKAGE_CHECKSUM}" \
            'type == "array" and length == 1 and
             (.[0].versions | all(.[]; (.checksum | type == "string" and
               length == 32 and test("^[A-F0-9]{32}$")))) and
             (.[0].versions | any(.version == $version and
               .targetAbi == "12.0.0.0" and .checksum == $checksum and
               (.sourceUrl | startswith("https://github.com/"))))' \
            manifest.json > /dev/null

          ensure_current_main_tip
          if [[ "${IS_DRAFT}" == "true" || "${PACKAGE_UPLOAD_REQUIRED}" == "true" ]]; then
            gh release upload "${RELEASE_TAG}" "${PACKAGE_NAME}" manifest.json --clobber
          else
            gh release upload "${RELEASE_TAG}" manifest.json --clobber
          fi
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg package "${PACKAGE_NAME}" --argjson draft "${IS_DRAFT}" \
            '(.draft == $draft) and any(.assets[]; .name == $package) and any(.assets[]; .name == "manifest.json")' \
            <<< "${RELEASE_JSON}" > /dev/null
          if [[ "${IS_DRAFT}" == "true" ]]; then
            ensure_current_main_tip
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
          fi
