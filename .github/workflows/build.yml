name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Jellyfin.Plugin.ForcePasswordChange

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.ForcePasswordChange -c Release --no-restore

      - name: Publish
        run: dotnet publish src/Jellyfin.Plugin.ForcePasswordChange -c Release -o output

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: output/
